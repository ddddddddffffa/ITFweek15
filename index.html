<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card & To-do List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121418;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1a1d24;
            border-radius: 16px;
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 800px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-right: 25px;
            border-right: 1px solid #2a2e39;
        }

        .profile img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff7b38;
            margin-bottom: 20px;
        }

        .profile h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .profile .student-id {
            font-size: 0.85rem;
            color: #8a8f9d;
            margin-bottom: 4px;
        }

        .profile .dept {
            font-size: 0.9rem;
            color: #8a8f9d;
            margin-bottom: 15px;
        }

        .profile .bio {
            font-size: 0.85rem;
            color: #a0a5b5;
            margin-bottom: 8px;
        }

        .profile .skills {
            font-size: 0.8rem;
            color: #727785;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .profile a {
            color: #ff7b38;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile a:hover {
            text-decoration: underline;
        }

        .todo {
            flex: 1;
            padding-left: 30px;
            display: flex;
            flex-direction: column;
        }

        .todo h2 {
            color: #ff7b38;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            background-color: #121418;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }

        .input-group input::placeholder {
            color: #525765;
        }

        .input-group button {
            background-color: #ff7b38;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-group button:hover {
            background-color: #e66827;
        }

        .todo ul {
            list-style: none;
        }

        .todo li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2e39;
            color: #d1d5db;
            font-size: 0.9rem;
        }

        .todo li:last-child {
            border-bottom: none;
        }

        .todo li button {
            background-color: #242832;
            color: #6b7280;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .todo li button:hover {
            background-color: #323745;
            color: #ffffff;
        }

        @media (max-width: 650px) {
            .card {
                flex-direction: column;
            }
            .profile {
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid #2a2e39;
                padding-bottom: 25px;
                margin-bottom: 25px;
            }
            .todo {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile">
            <img src="pikachu.jpg" alt="Profile Picture">
            <h1>Phuwit Piputsuwannachai</h1>
            <p class="student-id">student id : 69070162</p>
            <p class="dept">IT KMITL</p>
            <p class="bio">Hello Everyone</p>
            <p class="skills">SKILLS : coding</p>
            <a href="https://github.com/ddddddddffffa" target="_blank">github</a>
        </div>

        <div class="todo">
            <h2>To-do List</h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="พิมพ์สิ่งที่ต้องทำ...">
                <button id="add-btn">เพิ่ม</button>
            </div>
            <ul id="todo-list">
                <li>เล่นเกม<button>ลบ</button></li>
                <li>ทำโจทย์ <button>ลบ</button></li>
                <li>กินข้าว <button>ลบ</button></li>
                <li>นอน <button>ลบ</button></li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
